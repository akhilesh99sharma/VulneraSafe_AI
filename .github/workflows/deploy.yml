name: Deploy web app to GitHub Pages

# Builds the Vite static app (web/, base "/VulneraSafe_AI/") and deploys it to
# GitHub Pages using only free-tier, GitHub-native services (Requirements 15.2,
# 15.4, 18.7). Deployment goes live only after the user pushes this workflow and
# sets Pages source to "GitHub Actions" in the repository settings.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Minimal permissions required by the official GitHub Pages deployment path.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
